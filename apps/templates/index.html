<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Master's Log — Lock-In Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #080c14;
  --bg2: #0c1220;
  --surface: #121a2a;
  --surface2: #182235;
  --surface3: #1e2a40;
  --border: #2a3850;
  --border2: #354560;
  --text: #e9e6df;
  --text2: #a7b0c2;
  --text3: #6b7790;
  --gold: #c9a227;
  --gold2: #e0b83a;
  --gold-dim: rgba(201, 162, 39, 0.14);
  --orange: #d97706;
  --orange-dim: rgba(217, 119, 6, 0.14);
  --blue: #4a7a9b;
  --blue-dim: rgba(74, 122, 155, 0.14);
  --green: #2dd4a0;
  --green-dim: rgba(45, 212, 160, 0.12);
  --red: #e05a5a;
  --ivory: #f0ebe3;
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 248px;
  --font-ui: 'Inter', system-ui, sans-serif;
  --font-display: 'Cinzel', serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(74,122,155,.07),transparent),radial-gradient(ellipse 60% 40% at 90% 100%,rgba(201,162,39,.04),transparent)}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;transition:transform .25s}
.sidebar-header{padding:22px 18px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;background:linear-gradient(145deg,#1a2740,#0f1828);border:1.5px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 0 12px rgba(201,162,39,.15)}
.logo-text h1{font-family:var(--font-display);font-size:.95rem;font-weight:600;color:var(--ivory);letter-spacing:.04em}
.logo-text span{font-size:.68rem;color:var(--text3);letter-spacing:.02em}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-section{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);opacity:.7;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text2);font-size:.875rem;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--gold-dim);color:var(--gold2);border:1px solid rgba(201,162,39,.25)}
.nav-item .icon{font-size:1.05rem;width:22px;text-align:center}
.sidebar-footer{padding:14px;border-top:1px solid var(--border);font-size:.7rem;color:var(--text3);text-align:center;letter-spacing:.03em}
.main{flex:1;margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--bg2);position:sticky;top:0;z-index:40}
.topbar-title{font-family:var(--font-display);font-size:1.05rem;font-weight:600;color:var(--ivory);letter-spacing:.03em}
.topbar-actions{display:flex;gap:10px;align-items:center}
.content{flex:1;padding:24px 28px 48px;max-width:1400px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:border-color .15s,box-shadow .15s;position:relative}
.card:hover{border-color:var(--border2)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-title{font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.content{padding:16px}.menu-btn{display:block!important}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4}
.stat-card .label{font-size:.7rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-card .value{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ivory)}
.stat-card .sub{font-size:.75rem;color:var(--text3);margin-top:4px}
.stat-card.gold .value{color:var(--gold2)}.stat-card.green .value{color:var(--green)}.stat-card.orange .value{color:var(--orange)}.stat-card.blue .value{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-family:inherit;font-size:.85rem;font-weight:550;cursor:pointer;border:1px solid transparent;transition:all .15s}
.btn-primary{background:linear-gradient(145deg,#c9a227,#a8861e);color:#0c1220;border:none;box-shadow:0 2px 8px rgba(201,162,39,.25)}
.btn-primary:hover{background:linear-gradient(145deg,#e0b83a,#c9a227)}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.btn-sm{padding:5px 10px;font-size:.78rem}
.btn-danger{background:rgba(224,90,90,.12);color:var(--red)}.btn-danger:hover{background:rgba(224,90,90,.22)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.78rem;font-weight:500;color:var(--text2);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-family:inherit;font-size:.9rem;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
textarea{resize:vertical;min-height:70px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mood-selector{display:flex;gap:8px}
.mood-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-size:1.3rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.mood-btn:hover{border-color:var(--gold)}.mood-btn.active{border-color:var(--gold);background:var(--gold-dim);transform:scale(1.08);box-shadow:0 0 10px rgba(201,162,39,.2)}
.progress-bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .4s}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-header{text-align:center;font-size:.68rem;font-weight:600;color:var(--gold);opacity:.7;padding:6px 0;letter-spacing:.04em}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;cursor:pointer;border:1px solid transparent;transition:all .12s;background:var(--surface2)}
.cal-day:hover{border-color:var(--border2)}.cal-day.today{border-color:var(--gold);box-shadow:0 0 8px rgba(201,162,39,.2)}.cal-day.has-log{background:var(--gold-dim)}.cal-day.other-month{opacity:.3}
.cal-day .hours-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:2px}
.heat-cell{aspect-ratio:1;border-radius:2px;background:var(--surface3);width:10px;height:10px}
.heat-cell.l1{background:#1a3050}.heat-cell.l2{background:#2a4a6a}.heat-cell.l3{background:#3a6a8a}.heat-cell.l4{background:var(--gold)}
.skill-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.skill-row:last-child{border-bottom:none}
.skill-name{flex:1;font-size:.9rem;font-weight:500}
.quick-links{display:flex;flex-wrap:wrap;gap:8px}
.qlink{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;font-size:.8rem;color:var(--text2);text-decoration:none;transition:all .15s}
.qlink:hover{border-color:var(--gold);color:var(--text);background:var(--gold-dim);box-shadow:0 0 10px rgba(201,162,39,.12)}
.list-item{padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;transition:border-color .15s;cursor:pointer}
.list-item:hover{border-color:var(--border2)}
.list-item h4{font-size:.9rem;font-weight:600;margin-bottom:4px}
.list-item .meta{font-size:.75rem;color:var(--text3)}
.badge{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.badge-green{background:var(--green-dim);color:var(--green)}.badge-orange{background:var(--orange-dim);color:var(--orange)}.badge-blue{background:var(--blue-dim);color:var(--blue)}.badge-gold{background:var(--gold-dim);color:var(--gold2)}
.modal-overlay{position:fixed;inset:0;background:rgba(8,12,20,.75);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:90%;max-width:560px;max-height:85vh;overflow-y:auto;padding:24px;transform:translateY(12px);transition:transform .2s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal h3{font-family:var(--font-display);font-size:1.1rem;margin-bottom:18px;color:var(--ivory);letter-spacing:.03em}
.toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(145deg,#c9a227,#a8861e);color:#0c1220;padding:12px 20px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:200;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;box-shadow:0 4px 20px rgba(201,162,39,.3)}
.toast.show{opacity:1;transform:translateY(0)}.toast.error{background:var(--red);color:#fff}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}.empty .icon{font-size:2.2rem;margin-bottom:10px;opacity:.8}.empty .sticker{font-size:2.8rem;margin-bottom:8px}
.reco-box{background:linear-gradient(135deg,rgba(201,162,39,.06),rgba(74,122,155,.05));border:1px solid rgba(201,162,39,.22);border-radius:var(--radius);padding:16px 18px;position:relative}
.reco-box h4{font-size:.78rem;color:var(--gold2);margin-bottom:8px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.reco-box li{font-size:.88rem;color:var(--text2);margin-bottom:4px;list-style:none;padding-left:16px;position:relative}
.reco-box li::before{content:"⚔";position:absolute;left:0;font-size:.7rem;color:var(--gold);top:2px}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,var(--gold),var(--border));opacity:.5}
.timeline-item{position:relative;margin-bottom:20px}
.timeline-item::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface3);border:2px solid var(--border2)}
.timeline-item.current::before{background:var(--gold);border-color:var(--gold2);box-shadow:0 0 8px rgba(201,162,39,.4)}
.timeline-item.done::before{background:var(--green);border-color:var(--green)}
.hero-banner{background:linear-gradient(135deg,var(--surface) 0%,#0f1a2e 100%);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;overflow:hidden}
.hero-banner::after{content:'';position:absolute;top:-40%;right:-10%;width:200px;height:200px;background:radial-gradient(circle,rgba(201,162,39,.06),transparent 70%);pointer-events:none}
.hero-title{font-family:var(--font-display);font-size:1.35rem;font-weight:600;color:var(--ivory);letter-spacing:.04em}
.hero-sub{font-size:.85rem;color:var(--text3);margin-top:4px}
.hero-sticker{font-size:2.8rem;opacity:.9;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.section-title{font-family:var(--font-display);font-size:1.25rem;font-weight:600;margin-bottom:6px;letter-spacing:.03em;color:var(--ivory)}
.section-sub{font-size:.85rem;color:var(--text3);margin-bottom:22px}
.menu-btn{display:none;background:none;border:none;color:var(--text);font-size:1.3rem;cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">⚔</div>
    <div class="logo-text">
      <h1>GRAND MASTER</h1>
      <span>Command Center</span>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-section">Command</div>
    <button class="nav-item active" data-page="dashboard"><span class="icon">🛡</span> Dashboard</button>
    <button class="nav-item" data-page="dailylog"><span class="icon">📜</span> Daily Log</button>
    <button class="nav-item" data-page="calendar"><span class="icon">🗓</span> Calendar</button>
    <div class="nav-section">Expedition</div>
    <button class="nav-item" data-page="goals"><span class="icon">🗡</span> Goals</button>
    <button class="nav-item" data-page="projects"><span class="icon">⚙️</span> Projects</button>
    <button class="nav-item" data-page="skills"><span class="icon">⚔</span> Skills</button>
    <button class="nav-item" data-page="resources"><span class="icon">📚</span> Resources</button>
    <button class="nav-item" data-page="achievements"><span class="icon">🏅</span> Achievements</button>
    <div class="nav-section">Applications</div>
    <button class="nav-item" data-page="scholarships"><span class="icon">📜</span> Scholarships</button>
    <button class="nav-item" data-page="analytics"><span class="icon">🧭</span> Analytics</button>
    <div class="nav-section">System</div>
    <button class="nav-item" data-page="settings"><span class="icon">⚙️</span> Settings</button>
  </nav>
  <div class="sidebar-footer">Knights of Favonius · 2-Year Track</div>
</aside>
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="topbar-title" id="page-title">Dashboard</div>
    </div>
    <div class="topbar-actions">
      <span class="mono" style="font-size:.8rem;color:var(--text3)" id="today-display"></span>
      <button class="btn btn-ghost btn-sm" onclick="exportData('json')">Export</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
